# Apple Silicon GPU override
# ─────────────────────────────────────────────────────────────────────────────
# Docker on macOS cannot access Metal GPU — the Linux VM has no GPU pass-through.
# This override runs ONLY the btobot container in Docker and points it at a
# natively-running Ollama process on the host, which DOES use Metal.
#
# Usage:
#   Step 1 — start Ollama natively (in a separate terminal, keep it running):
#     OLLAMA_MAX_LOADED_MODELS=2 OLLAMA_FLASH_ATTENTION=1 ollama serve
#
#   Step 2 — start btobot (no bundled Ollama container):
#     docker compose -f docker-compose.yml -f docker-compose.mac-gpu.yml up --build
#
#   Subsequent runs (volumes already populated):
#     docker compose -f docker-compose.yml -f docker-compose.mac-gpu.yml up

services:

  # Replace the bundled Ollama with a trivial no-op container that passes its
  # health check immediately. This satisfies btobot's depends_on without starting
  # a real Ollama inside Docker. The actual Ollama runs natively on your Mac
  # (started in Terminal 1) and btobot reaches it via host.docker.internal.
  ollama:
    image: alpine
    command: ["tail", "-f", "/dev/null"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
      timeout: 1s
      retries: 1
      start_period: 0s

  btobot:
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434   # host's native Ollama
